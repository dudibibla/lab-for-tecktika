name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC federated login, no client secret stored
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION || 'swedencentral' }}"

      # main.bicepparam already carries the real Entra tenant/client IDs (public
      # identifiers - they ship in the frontend bundle). Only override them when
      # a secret is actually set: an unset secret expands to an empty string,
      # which silently wiped AZURE_CLIENT_ID_API on the Container App and made
      # the backend return 503 on every authenticated request.
      - name: Build optional Entra/GHCR parameter overrides
        id: entra
        env:
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
          # The GHCR package backing the backend image doesn't reliably stay
          # pullable anonymously even when set to Public (observed live
          # 2026-09-16), so the Container App needs an explicit credential
          # regardless of visibility. Without this, every infra redeploy fails
          # provisioning the backend image ("DENIED: requested access ...").
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "::add-mask::$GHCR_PAT"
          fi
          overrides=""
          if [ -n "$ENTRA_TENANT_ID" ]; then
            overrides="$overrides entraTenantId=$ENTRA_TENANT_ID"
          fi
          if [ -n "$ENTRA_API_CLIENT_ID" ]; then
            overrides="$overrides entraApiClientId=$ENTRA_API_CLIENT_ID"
          fi
          if [ -n "$GHCR_PAT" ]; then
            overrides="$overrides ghcrPassword=$GHCR_PAT"
          fi
          if [ -n "$overrides" ]; then
            overrides="--parameters$overrides"
          fi
          echo "overrides=$overrides" >> "$GITHUB_OUTPUT"

      # ci-worker.yml publishes through Azure/functions-action, which on Linux
      # Consumption with RBAC deploys by writing a WEBSITE_RUN_FROM_PACKAGE
      # blob URL onto the Function App. compute.bicep declares the app's
      # settings inline, and ARM treats that array as authoritative - so an
      # infra deploy deletes the key and leaves the worker running with no
      # code (observed live 2026-09-08). Preserving it inside the template
      # needs the resource to read its own current settings, which ARM
      # rejects as a circular dependency, so it is captured and put back here
      # instead. Nothing to restore on a first deploy, when it doesn't exist.
      - name: Capture worker package URL
        id: worker_pkg
        run: |
          value="$(az functionapp config appsettings list             --name "${{ vars.FUNCTION_APP_NAME }}"             --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"             --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]"             -o tsv 2>/dev/null || true)"
          if [ -n "$value" ]; then
            echo "::add-mask::$value"
            echo "Captured WEBSITE_RUN_FROM_PACKAGE to restore after the deploy."
          else
            echo "No WEBSITE_RUN_FROM_PACKAGE on the worker - nothing to restore."
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Validate template
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            ${{ steps.entra.outputs.overrides }}

      - name: Deploy
        run: |
          az deployment group create \
            --name "gha-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.bicepparam \
            ${{ steps.entra.outputs.overrides }}

      - name: Restore worker package URL
        if: always() && steps.worker_pkg.outputs.value != ''
        env:
          PACKAGE_URL: ${{ steps.worker_pkg.outputs.value }}
        run: |
          current="$(az functionapp config appsettings list             --name "${{ vars.FUNCTION_APP_NAME }}"             --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"             --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]"             -o tsv 2>/dev/null || true)"
          if [ "$current" = "$PACKAGE_URL" ]; then
            echo "Worker package URL survived the deploy."
            exit 0
          fi
          echo "Deploy dropped WEBSITE_RUN_FROM_PACKAGE - putting it back."
          az functionapp config appsettings set             --name "${{ vars.FUNCTION_APP_NAME }}"             --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"             --settings "WEBSITE_RUN_FROM_PACKAGE=$PACKAGE_URL"             --output none

      - name: Show outputs
        run: |
          az deployment group show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "gha-${{ github.run_id }}" \
            --query properties.outputs
